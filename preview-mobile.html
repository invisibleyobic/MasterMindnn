<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мобильный предпросмотр — Business Syndicate</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#f2f2f4;
    font-family:'Segoe UI',system-ui,sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:28px 16px;box-sizing:border-box;}
  .cap{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#9a9aa3;}
  .cap b{color:#fa1e32;}
  .phone{position:relative;width:390px;max-width:92vw;aspect-ratio:9/19.5;
    border-radius:44px;padding:12px;background:#050506;
    box-shadow:0 0 0 2px #26262e,0 40px 120px rgba(0,0,0,.7),0 0 60px rgba(250,30,50,.12);}
  .phone::before{content:"";position:absolute;top:16px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#050506;border-radius:16px;z-index:2;}
  .screen{width:100%;height:100%;border:0;border-radius:34px;background:#05060a;display:block;}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{font-size:13px;color:#fff;background:#17171d;border:1px solid #26262e;
    border-radius:10px;padding:.6em 1.1em;cursor:pointer;text-decoration:none;}
  .btn:hover{border-color:#fa1e32;}
</style>
</head>
<body>
  <div class="wrap">
    <p class="cap">Мобильный предпросмотр · <b>Business Syndicate</b> · 9×16</p>
    <div class="phone">
      <iframe id="scr" class="screen" src="v1.html" title="Мобильная версия"></iframe>
    </div>
    <div class="row">
      <a class="btn" href="v1.html" target="_blank" rel="noopener">Открыть десктоп-версию ↗</a>
      <button class="btn" id="reel" type="button">Проиграть авто-прокат ↺</button>
    </div>
  </div>
  <script>
    document.getElementById('reel').addEventListener('click',function(){
      document.getElementById('scr').src = 'v1.html?auto=45';
    });
  </script>
</body>
</html>
